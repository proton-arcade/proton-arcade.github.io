<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 35%, #34204f, #101014 65%); color: #fff; font: 16px Arial, sans-serif; text-align: center; }
    main { padding: 2rem; }
    h1 { font-size: clamp(2rem, 8vw, 4rem); margin: 0 0 1rem; }
    button { border: 0; border-radius: 999px; padding: .9rem 1.4rem; color: #fff; background: #dd3532; font: inherit; font-weight: bold; cursor: pointer; }
    #score { color: #ffce62; font-size: 1.3rem; }
  </style>
</head>
<body>
  <main>
    <p>REMOVABLE DEMO</p>
    <h1>Games</h1>
    <p>Use this sample to check the arcade player, fullscreen, and reload controls.</p>
    <p id="score">Button presses: 0</p>
    <button id="press" type="button">Press to test</button>
  </main>
  <script>
    let score = 0;
    document.getElementById('press').addEventListener('click', () => {
      score += 1;
      document.getElementById('score').textContent = `Button presses: ${score}`;
    });
  </script>
</body>
</html>
