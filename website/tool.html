<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121212" />
    <title>Tool — Exst Arcade</title>
    <meta
      name="description"
      content="Tool player page with a back arrow and a full-screen style frame."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Exst Arcade" />
    <meta property="og:title" content="Tool — Exst Arcade" />
    <meta
      property="og:description"
      content="Open a tool right here."
    />
    <link
      rel="icon"
      href="assets/images/favicon.svg?v=red-2"
      type="image/svg+xml"
    />
    <link
      rel="apple-touch-icon"
      href="assets/images/favicon.svg?v=red-2"
    />
    <link rel="icon" href="../favicon.ico?v=red-2" sizes="16x16 32x32 48x48" />
    <link rel="stylesheet" href="assets/css/arcade.css" />
    <link rel="stylesheet" href="assets/css/flix.css" />
  </head>
  <body class="player-body">
    <noscript>
      <p style="padding: 1rem; text-align: center">
        The tool player needs JavaScript. Please enable JavaScript and reload
        this page.
      </p>
    </noscript>
    <header class="player-bar">
      <a
        id="backLink"
        class="back-button"
        href="../index.html#tools"
        aria-label="Back to tools"
        >←</a
      >
      <a class="flix-mini-logo" href="../index.html">ExstArcade</a>
      <div class="player-title">
        <h1 id="toolTitle">Loading tool…</h1><span id="toolMeta"></span>
      </div>
      <div class="player-actions">
        <button id="fullscreenTool" type="button">Fullscreen</button>
        <button id="reloadTool" type="button">Reload</button>
        <a id="openDirect" target="_blank" rel="noopener">Open new tab</a>
      </div>
    </header>
    <main class="game-shell">
      <!-- Populated when a catalog edit needs attention (see config-loader.js). -->
      <div id="toolNotice"></div>
      <iframe
        id="toolFrame"
        title="Tool frame"
        allow="fullscreen; autoplay; clipboard-read; clipboard-write"
        allowfullscreen
      ></iframe>
      <section id="toolFallback" class="frame-fallback" hidden>
        <h1>That tool file is missing</h1>
        <p>
          The catalog points at the file below (relative to the
          <code>website/</code> folder), but it is not there. Drop the tool
          file in that spot, or fix the <code>path=</code> line in
          <code>data/applications.js</code>.
        </p>
        <code id="missingPath"></code>
      </section>
    </main>
    <script src="data/applications.js"></script>
    <script src="assets/js/config-loader.js"></script>
    <script src="assets/js/tool.js"></script>
  </body>
</html>
