<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Consoles — ROM Arcade</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%B9%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/arcade.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main>
    <div class="container">
        <!-- banner (filled by JS for ?system=…) -->
        <div id="banner-slot"></div>

        <!-- console picker (shown when no/unknown system) -->
        <section class="section" id="all-consoles" style="display:none">
            <div class="section-head">
                <h2>Pick a Console Section</h2>
            </div>
            <p class="section-blurb">Every supported system has its own section. Click one to open it — for example, the <b>NES section</b>.</p>
            <div class="toolbar">
                <input class="input" type="search" id="console-q" placeholder="Filter consoles by name… (e.g. “Nintendo”, “Sega”)" autocomplete="off">
            </div>
            <div class="console-grid" id="all-console-grid"></div>
        </section>

        <!-- games for this console -->
        <section class="section" id="console-section" style="display:none">
            <div class="toolbar">
                <input class="input" type="search" id="game-q" placeholder="Search games in this section…" autocomplete="off">
                <label class="btn btn-ghost" style="cursor:pointer">
                    📂 Open file… <input type="file" id="open-file" hidden>
                </label>
            </div>
            <div class="result-count" id="result-count"></div>
            <div class="game-grid" id="game-grid"></div>

            <div class="section" style="padding-top:40px">
                <div class="section-head">
                    <h2 style="font-size:19px" id="add-title">Add ROMs to this console</h2>
                </div>
                <div id="dropzone" class="dropzone">
                    <span class="dz-icon">📂</span>
                    <h3 id="dz-title">Drop ROM files here, or click to browse</h3>
                    <p>Files are tagged for this console automatically — no <code>roms.json</code> editing required.</p>
                </div>
            </div>
        </section>
    </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/arcade.js"></script>
<script>
(async function () {
    if (await Arcade.boot("consoles")) return;

    const params = new URLSearchParams(location.search);
    const system = params.get("system");
    const info = system && CONSOLES[system] && !Arcade.isConsoleHidden(system)
        ? CONSOLES[system] : null;

    if (!info) {
        /* ---------- console picker ---------- */
        document.title = "Consoles — ROM Arcade";
        const grid = $("#all-console-grid");
        const qInput = $("#console-q");
        $("#all-consoles").style.display = "";

        async function drawAll() {
            const games = await Arcade.listGames();
            const counts = Arcade.countsByConsole(games);
            const term = (qInput.value || "").trim().toLowerCase();
            const keys = Object.keys(CONSOLES).filter(function (k) {
                if (Arcade.isConsoleHidden(k)) return false;
                if (!term) return true;
                const c = CONSOLES[k];
                return c.name.toLowerCase().indexOf(term) !== -1 ||
                    c.short.toLowerCase().indexOf(term) !== -1 ||
                    c.company.toLowerCase().indexOf(term) !== -1;
            });
            grid.innerHTML = keys.length
                ? keys.map(function (k) { return Arcade.consoleCardHTML(k, counts[k] || 0); }).join("")
                : '<div class="empty-note">No consoles match that filter.</div>';
        }
        qInput.addEventListener("input", debounce(drawAll, 160));
        await drawAll();
        return;
    }

    /* ---------- single console section ---------- */
    document.title = info.name + " — ROM Arcade";
    $("#banner-slot").innerHTML =
        '<div class="console-banner" style="--ccolor:' + info.color + '">' +
        '  <div class="cb-icon">' + info.icon + "</div>" +
        '  <div class="cb-body">' +
        "    <h1>" + esc(info.name) + "</h1>" +
        '    <div class="cb-sub">' + esc(info.company) + " · " + info.year +
        ' · <b id="cb-count">0 games</b></div>' +
        '    <div class="cb-blurb">' + esc(info.blurb) + "</div>" +
        "  </div>" +
        '  <a class="btn btn-ghost" href="console.html">← All consoles</a>' +
        "</div>";

    $("#console-section").style.display = "";
    $("#add-title").textContent = "Add ROMs to the " + (info.short || info.name) + " section";
    $("#dz-title").textContent = "Drop " + (info.short || info.name) + " ROMs here, or click to browse";

    const grid = $("#game-grid");
    const qInput = $("#game-q");
    const countEl = $("#result-count");
    let cache = [];

    Arcade.bindGameCards(grid);

    async function render() {
        const games = await Arcade.listGames();
        cache = games.filter(function (g) { return g.core === system; })
            .sort(function (a, b) { return a.name.localeCompare(b.name, undefined, { numeric: true }); });
        $("#cb-count").textContent = cache.length + " game" + (cache.length === 1 ? "" : "s");
        draw();
    }

    function draw() {
        const term = qInput.value.trim().toLowerCase();
        const shown = cache.filter(function (g) {
            return !term || g.name.toLowerCase().indexOf(term) !== -1 || g.file.toLowerCase().indexOf(term) !== -1;
        });
        countEl.textContent = shown.length + " game" + (shown.length === 1 ? "" : "s") + " in this section";
        Arcade.renderGameGrid(grid, shown,
            "No " + esc(info.name) + " games yet. Drop one below — or grab some at " +
            '<a href="https://www.romsgames.net/" target="_blank" rel="noopener">ROMsGames.net</a>.');
        Arcade.fillArt(grid, shown);
    }

    qInput.addEventListener("input", debounce(draw, 160));
    $("#open-file").addEventListener("change", function (e) {
        if (e.target.files && e.target.files[0]) Arcade.openLocalFile(e.target.files[0]);
    });

    Arcade._render = render;
    Arcade.mountUploader($("#dropzone"), { core: system });
    await render();
})();
</script>
</body>
</html>
